[workspace]
members = [
    "src/backend/core",
    "src/backend/db",
    "src/backend/http",
    "src/backend/parsers",
    "src/backend/sqlx-postgres-facade",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
axum = { version = "0.7", features = ["multipart"] }
base64 = "0.22"
bcrypt = "0.17"
bytes = "1.9"
calamine = { version = "0.35.0", default-features = false }
csv = "1.3"
encoding_rs = "0.8"
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
http = "1.2"
md5 = "0.7"
qrcodegen = "1.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
regex = "1.11"
ring = "0.17.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.42", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
url = "2.5"
sqlx = { path = "src/backend/sqlx-postgres-facade" }
tempfile = "3.14"
walkdir = "2.5"
zip = { version = "7.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[workspace.lints.clippy]
all = "warn"
