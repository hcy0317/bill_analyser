[project]
name = "bill-analyser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.0",
    "aiosqlite>=0.21.0",
    "bcrypt>=5.0.0",
    "chardet>=5.2.0",
    "cryptography>=45.0.0",
    "python-dotenv>=1.1.1",
    "flask>=3.1.0",
    "flask-cors>=6.0.0",
    "jinja2>=3.1.0",
    "lxml>=6.0.0",
    "matplotlib>=3.10.0",
    "nest-asyncio>=1.6.0",
    "numpy>=2.2.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0",
    "pydantic>=2.12.0",
    "pyjwt>=2.10.0",
    "pylint>=4.0.0",
    "pyotp>=2.9.0",
    "pytz>=2025.2",
    "qrcode[pil]>=8.2",
    "requests>=2.32.0",
    "httpx>=0.28.0",
    "watchdog>=6.0.0",
    "werkzeug>=3.1.0",
    "xlrd>=2.0.0",
]

[project.optional-dependencies]
encryption = ["sqlcipher3-binary>=0.5.0"]

[project.scripts]
server = "bill_analyser.api.app:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.10.8"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "python-dateutil>=2.9.0",
    "poethepoet>=0.42.1",
    "bump-my-version>=1.2.7",
    "inline-snapshot>=0.32.4",
]

[tool.uv.pip]
universal = true

[tool.poe.tasks]
test = "pytest --cov=src/bill_analyser --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=90 tests/ -v -n auto --dist loadfile"
bump = "bump-my-version bump"
show-bump = "bump-my-version show-bump"

[tool.pyright]
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [
    ".venv",
    "backup",
    "bills",
    "data",
    "logs",
    "output",
    "uploads",
    "src/web/dist",
    "src/web/node_modules",
]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "W",   # pycodestyle warnings
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "T10", # flake8-debugger
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "TC",  # flake8-type-checking
    "DTZ", # flake8-datetimez
    "RUF", # Ruff-specific rules
    "I",   # isort
]
ignore = [
    "E402",   # module-import-not-at-top-of-file
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@overload",
    "except ImportError:",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.bumpversion]
current_version = "0.0.1"
commit = true
message = "chore(release): {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = "## [Unreleased]\n\n## [{new_version}] - {now:%Y-%m-%d}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
regex = true
search = "\\[Unreleased\\]: (https://.+?)v{current_version}\\.\\.\\.HEAD"
replace = "[Unreleased]: \\1v{new_version}...HEAD\n[{new_version}]: \\1v{current_version}...v{new_version}"

[[tool.bumpversion.files]]
filename = "uv.lock"
search = "name = \"bill-analyser\"\nversion = \"{current_version}\""
replace = "name = \"bill-analyser\"\nversion = \"{new_version}\""

[tool.inline-snapshot]
format-command = "uv format -- --stdin-filename {filename}"
