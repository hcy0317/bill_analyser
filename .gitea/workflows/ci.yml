name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional immutable base SHA for changed-line coverage
        required: false
        type: string

permissions:
  contents: read

env:
  TZ: Asia/Shanghai
  JWT_SECRET_KEY: ci-test-jwt-secret
  BILL_ANALYSER_OPERATION_PASSWORD: ci-test-operation-password

jobs:
  backend-ci:
    name: backend-ci
    runs-on: ubuntu-latest
    env:
      BILL_ANALYSER_TEST_POSTGRES_URL: postgresql://bill_analyser:bill_analyser@postgres:5432/bill_analyser_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bill_analyser
          POSTGRES_PASSWORD: bill_analyser
          POSTGRES_DB: bill_analyser_test
        options: >-
          --health-cmd "pg_isready -U bill_analyser -d bill_analyser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve immutable CI diff refs
        run: node scripts/resolve-ci-diff-refs.mjs resolve --event-name "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" --remote origin --default-base refs/heads/main --out .omx/ultragoal/evidence/ci-diff-refs.json

      - name: Restore Rust toolchain cache
        id: rust-toolchain-cache
        uses: https://github.com/actions/cache/restore@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
            ~/.cargo/bin/rustup
            ~/.cargo/bin/cargo
            ~/.cargo/bin/cargo-clippy
            ~/.cargo/bin/cargo-fmt
            ~/.cargo/bin/clippy-driver
            ~/.cargo/bin/rustc
            ~/.cargo/bin/rustdoc
            ~/.cargo/bin/rustfmt
          key: ${{ runner.os }}-rust-toolchain-slim-v3-1.98.0-bootstrap
          restore-keys: |
            ${{ runner.os }}-rust-toolchain-slim-v3-1.98.0-

      - name: Activate cached Rust tools
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          if command -v rustup >/dev/null 2>&1; then
            rustup --version
          fi
          if command -v cargo >/dev/null 2>&1; then
            cargo --version
          fi

      - name: Setup Rust 1.98.0
        id: rust-toolchain
        uses: https://github.com/dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt,clippy,llvm-tools-preview

      - name: Restore Cargo cache
        uses: https://github.com/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-slim-v2-rust-1.98.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-slim-v2-rust-1.98.0-

      - name: Check Cargo metadata
        run: cargo metadata --locked --format-version 1 >/tmp/bill-analyser-cargo-metadata.json

      - name: Run Rust backend structure check
        run: node scripts/check-rust-backend-structure.mjs

      - name: Run Rust format check
        run: cargo fmt --all -- --check

      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run assembled runtime route ownership contract
        run: cargo test -p bill-analyser-http --test runtime_route_ownership_contract -- --nocapture

      - name: Build Rust HTTP server
        run: cargo build -p bill-analyser-http --bin bill_http_server

      - name: Install Rust coverage tool
        run: |
          rustup component add llvm-tools-preview
          if ! command -v cargo-llvm-cov >/dev/null 2>&1; then
            cargo install cargo-llvm-cov --locked
          fi

      - name: Run Rust workspace tests with coverage
        run: cargo llvm-cov --workspace --lcov --output-path workspace.lcov --fail-under-lines 35

      - name: Enforce Rust changed-line coverage
        run: |
          MERGE_BASE_SHA="$(node scripts/resolve-ci-diff-refs.mjs read --input .omx/ultragoal/evidence/ci-diff-refs.json --field merge_base_sha)"
          HEAD_SHA="$(node scripts/resolve-ci-diff-refs.mjs read --input .omx/ultragoal/evidence/ci-diff-refs.json --field head_sha)"
          rust_business_diff_exit=0
          git -c gc.auto=0 diff --quiet "$MERGE_BASE_SHA...$HEAD_SHA" -- src/backend || rust_business_diff_exit=$?
          if [ "$rust_business_diff_exit" -eq 0 ]; then
            echo "Rust business source unchanged; changed-line coverage not applicable."
          elif [ "$rust_business_diff_exit" -eq 1 ]; then
            git -c gc.auto=0 diff --unified=0 "$MERGE_BASE_SHA...$HEAD_SHA" -- src/backend tests/backend > .omx/ultragoal/evidence/rust-changed.diff
            node scripts/governance-normalizers.mjs changed-coverage --lcov workspace.lcov --diff .omx/ultragoal/evidence/rust-changed.diff --threshold 90 --require-matched-files --require-executable-lines --allow-no-business-files
          else
            exit "$rust_business_diff_exit"
          fi

      - name: Trim backend caches before cache save
        id: backend-cache-trim
        if: always()
        run: |
          cache_size_mb() {
            total=0
            for cache_path in "$@"; do
              if [ -e "$cache_path" ]; then
                size="$(du -sm "$cache_path" | awk '{print $1 + 0}')"
                total=$((total + size))
              fi
            done
            echo "$total"
          }

          rm -rf target
          rm -f workspace.lcov /tmp/bill-analyser-cargo-metadata.json

          cargo_cache_mb="$(cache_size_mb ~/.cargo/registry ~/.cargo/git ~/.cargo/bin/cargo-llvm-cov)"
          if [ "$cargo_cache_mb" -gt 450 ]; then
            rm -rf ~/.cargo/registry/src ~/.cargo/git/checkouts
          fi
          cargo_cache_mb="$(cache_size_mb ~/.cargo/registry ~/.cargo/git ~/.cargo/bin/cargo-llvm-cov)"
          if [ "$cargo_cache_mb" -gt 450 ]; then
            rm -rf ~/.cargo/registry/cache ~/.cargo/git/db
          fi

          rustup_cache_mb="$(cache_size_mb ~/.rustup/toolchains ~/.rustup/update-hashes ~/.rustup/settings.toml ~/.cargo/bin/rustup ~/.cargo/bin/cargo ~/.cargo/bin/cargo-clippy ~/.cargo/bin/cargo-fmt ~/.cargo/bin/clippy-driver ~/.cargo/bin/rustc ~/.cargo/bin/rustdoc ~/.cargo/bin/rustfmt)"
          if [ "$rustup_cache_mb" -gt 1450 ]; then
            echo "rust_toolchain_cache_save=false" >> "$GITHUB_OUTPUT"
            rm -rf ~/.rustup/toolchains ~/.rustup/update-hashes ~/.rustup/settings.toml
            rm -f ~/.cargo/bin/rustup ~/.cargo/bin/cargo ~/.cargo/bin/cargo-clippy ~/.cargo/bin/cargo-fmt ~/.cargo/bin/clippy-driver ~/.cargo/bin/rustc ~/.cargo/bin/rustdoc ~/.cargo/bin/rustfmt
          else
            echo "rust_toolchain_cache_save=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Rust toolchain cache key
        id: rust-toolchain-cache-key
        run: echo "key=${{ runner.os }}-rust-toolchain-slim-v3-1.98.0-${{ steps.rust-toolchain.outputs.cachekey }}" >> "$GITHUB_OUTPUT"

      - name: Save Rust toolchain cache
        if: steps.backend-cache-trim.outputs.rust_toolchain_cache_save == 'true' && steps.rust-toolchain-cache.outputs.cache-matched-key != steps.rust-toolchain-cache-key.outputs.key
        uses: https://github.com/actions/cache/save@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
            ~/.cargo/bin/rustup
            ~/.cargo/bin/cargo
            ~/.cargo/bin/cargo-clippy
            ~/.cargo/bin/cargo-fmt
            ~/.cargo/bin/clippy-driver
            ~/.cargo/bin/rustc
            ~/.cargo/bin/rustdoc
            ~/.cargo/bin/rustfmt
          key: ${{ steps.rust-toolchain-cache-key.outputs.key }}

  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve immutable CI diff refs
        run: node scripts/resolve-ci-diff-refs.mjs resolve --event-name "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" --remote origin --default-base refs/heads/main --out .omx/ultragoal/evidence/ci-diff-refs.json

      - name: Restore npm cache
        uses: https://github.com/actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-slim-v1-${{ hashFiles('src/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-slim-v1-

      - name: Install dependencies
        working-directory: src/web
        run: npm ci

      - name: Run frontend structure check
        run: npm --prefix src/web run structure:check

      - name: Run lint
        working-directory: src/web
        run: npm run lint:ci

      - name: Run tests with coverage
        working-directory: src/web
        run: npm run test:coverage

      - name: Enforce frontend changed-line coverage
        run: |
          MERGE_BASE_SHA="$(node scripts/resolve-ci-diff-refs.mjs read --input .omx/ultragoal/evidence/ci-diff-refs.json --field merge_base_sha)"
          HEAD_SHA="$(node scripts/resolve-ci-diff-refs.mjs read --input .omx/ultragoal/evidence/ci-diff-refs.json --field head_sha)"
          frontend_business_diff_exit=0
          git -c gc.auto=0 diff --quiet "$MERGE_BASE_SHA...$HEAD_SHA" -- src/web/src || frontend_business_diff_exit=$?
          if [ "$frontend_business_diff_exit" -eq 0 ]; then
            echo "Frontend business source unchanged; changed-line coverage not applicable."
          elif [ "$frontend_business_diff_exit" -eq 1 ]; then
            git -c gc.auto=0 diff --unified=0 "$MERGE_BASE_SHA...$HEAD_SHA" -- src/web tests/web > .omx/ultragoal/evidence/frontend-changed.diff
            node scripts/governance-normalizers.mjs changed-coverage --lcov src/web/coverage/lcov.info --diff .omx/ultragoal/evidence/frontend-changed.diff --threshold 90 --require-matched-files --require-executable-lines --allow-no-business-files
          else
            exit "$frontend_business_diff_exit"
          fi

      - name: Build frontend
        working-directory: src/web
        run: npm run build

      - name: Trim frontend caches before cache save
        if: always()
        working-directory: src/web
        run: |
          rm -rf node_modules coverage dist
          npm cache verify || true
          npm_cache_dir="$(npm config get cache)"
          npm_cache_mb=0
          if [ -e "$npm_cache_dir" ]; then
            npm_cache_mb="$(du -sm "$npm_cache_dir" | awk '{print $1 + 0}')"
          fi
          if [ "$npm_cache_mb" -gt 300 ]; then
            npm cache clean --force
          fi

  repo-governance:
    name: repo-governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore governance npm cache
        id: governance-npm-cache
        uses: https://github.com/actions/cache/restore@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-slim-v1-${{ hashFiles('src/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-slim-v1-

      - name: Install locked workflow checker dependencies
        run: npm ci --prefix src/web

      - name: Self-test immutable CI diff resolver
        run: node scripts/resolve-ci-diff-refs.mjs --self-test

      - name: Check E2E scope classifier
        run: node scripts/check-e2e-scope.mjs

      - name: Check E2E outcome verifier
        run: node scripts/check-e2e-outcome.mjs

      - name: Self-test Gitea workflow checker
        run: node scripts/check-gitea-workflow.mjs --self-test

      - name: Check Gitea workflow
        run: node scripts/check-gitea-workflow.mjs

      - name: Check backend documentation map
        run: node scripts/check-backend-doc-map.mjs

      - name: Check governance normalizers
        run: node scripts/check-governance-normalizers.mjs

      - name: Ensure tracked source tree is Rust-only
        run: node scripts/check-rust-only-source-tree.mjs

  e2e-scope:
    name: e2e-scope
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.e2e-scope.outputs.required }}
      reason: ${{ steps.e2e-scope.outputs.reason }}
    steps:
      - name: Checkout E2E scope source
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup E2E scope Node.js 22
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve E2E immutable CI diff refs
        run: node scripts/resolve-ci-diff-refs.mjs resolve --event-name "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" --remote origin --default-base refs/heads/main --out .omx/ultragoal/evidence/ci-diff-refs.json

      - name: Classify E2E scope
        id: e2e-scope
        run: node scripts/classify-e2e-scope.mjs --event-name "$GITHUB_EVENT_NAME" --input .omx/ultragoal/evidence/ci-diff-refs.json --out "$GITHUB_OUTPUT"

  e2e-heavy:
    name: e2e-heavy
    runs-on: ubuntu-latest
    needs: e2e-scope
    if: needs.e2e-scope.outputs.required == 'true'
    env:
      BILL_ANALYSER_DATABASE_BACKEND: postgres
      BILL_ANALYSER_POSTGRES_URL: postgresql://bill_analyser_e2e:bill_analyser_e2e@postgres:5432/bill_analyser_e2e
      BILL_ANALYSER_WEAVIATE_ENABLED: 'true'
      BILL_ANALYSER_WEAVIATE_ENDPOINT: http://weaviate:8080
      BILL_ANALYSER_WEAVIATE_COLLECTION_PREFIX: BillAnalyserE2E${{ github.run_id }}
      BILL_ANALYSER_HTTP_BIND: 127.0.0.1:5000
      BILL_ANALYSER_AUTH_JWT_SECRET: bill-analyser-e2e-ci-${{ github.run_id }}
      BILL_ANALYSER_AUTH_ENABLE_USER_REGISTRATION: 'true'
      BILL_ANALYSER_AUTH_REQUIRE_EMAIL_VERIFICATION: 'false'
      E2E_RUN_ID: ${{ github.run_id }}
      E2E_EXPECTED_WEAVIATE_PREFIX: BillAnalyserE2E${{ github.run_id }}
      E2E_STRICT_CLEANUP: 'true'
      E2E_ALLOW_CI_SERVICE_HOSTS: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bill_analyser_e2e
          POSTGRES_USER: bill_analyser_e2e
          POSTGRES_PASSWORD: bill_analyser_e2e
        options: >-
          --health-cmd "pg_isready -U bill_analyser_e2e -d bill_analyser_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      weaviate:
        image: cr.weaviate.io/semitechnologies/weaviate:1.37.4
        env:
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
          DEFAULT_VECTORIZER_MODULE: none
          PERSISTENCE_DATA_PATH: /var/lib/weaviate
          CLUSTER_HOSTNAME: e2e-node
    steps:
      - name: Checkout E2E source
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup E2E Node.js 22
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore E2E Rust toolchain cache
        id: e2e-rust-toolchain-cache
        uses: https://github.com/actions/cache/restore@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
            ~/.cargo/bin/rustup
            ~/.cargo/bin/cargo
            ~/.cargo/bin/cargo-clippy
            ~/.cargo/bin/cargo-fmt
            ~/.cargo/bin/clippy-driver
            ~/.cargo/bin/rustc
            ~/.cargo/bin/rustdoc
            ~/.cargo/bin/rustfmt
          key: ${{ runner.os }}-rust-toolchain-slim-v3-1.98.0-bootstrap
          restore-keys: |
            ${{ runner.os }}-rust-toolchain-slim-v3-1.98.0-

      - name: Activate cached E2E Rust tools
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          if command -v rustup >/dev/null 2>&1; then
            rustup --version
          fi
          if command -v cargo >/dev/null 2>&1; then
            cargo --version
          fi

      - name: Setup E2E Rust 1.98.0
        uses: https://github.com/dtolnay/rust-toolchain@1.98.0

      - name: Restore E2E Cargo cache
        id: e2e-cargo-cache
        uses: https://github.com/actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-slim-v2-rust-1.98.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-slim-v2-rust-1.98.0-

      - name: Restore E2E npm cache
        id: e2e-npm-cache
        uses: https://github.com/actions/cache/restore@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-slim-v1-${{ hashFiles('src/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-slim-v1-

      - name: Install locked E2E dependencies
        run: npm ci --prefix src/web

      - name: Install Playwright Chromium
        run: npm --prefix src/web run e2e:install -- --with-deps

      - name: Run deterministic E2E supervisor
        run: npm --prefix src/web run e2e:ci:smoke

  e2e-ci:
    name: e2e-ci
    runs-on: ubuntu-latest
    needs:
      - e2e-scope
      - e2e-heavy
    if: ${{ always() }}
    steps:
      - name: Checkout E2E outcome source
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup E2E outcome Node.js 22
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify E2E outcome
        run: node scripts/verify-e2e-outcome.mjs --scope-result "${{ needs.e2e-scope.result }}" --scope-required "${{ needs.e2e-scope.outputs.required }}" --scope-reason "${{ needs.e2e-scope.outputs.reason }}" --heavy-result "${{ needs.e2e-heavy.result }}"
