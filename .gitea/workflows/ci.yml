name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/**'
      - '.claude/**'
      - '.codex/**'
      - '.agents/**'
      - '.gitea/**'
      - '.omx/plans/**'
      - 'docs/**'
      - 'scripts/**'
      - 'src/web/**'
      - 'tests/backend/**'
      - 'tests/fixtures/**'
      - 'tests/web/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/backend/**'
      - '*.ps1'
      - '*.bat'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/**'
      - '.claude/**'
      - '.codex/**'
      - '.agents/**'
      - '.gitea/**'
      - '.omx/plans/**'
      - 'docs/**'
      - 'scripts/**'
      - 'src/web/**'
      - 'tests/backend/**'
      - 'tests/fixtures/**'
      - 'tests/web/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/backend/**'
      - '*.ps1'
      - '*.bat'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai
  JWT_SECRET_KEY: ci-test-jwt-secret
  BILL_ANALYSER_OPERATION_PASSWORD: ci-test-operation-password

jobs:
  backend-ci:
    name: backend-ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bill_analyser_test
          POSTGRES_USER: bill_analyser
          POSTGRES_PASSWORD: bill_analyser_dev
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U bill_analyser -d bill_analyser_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4

      - name: Restore Rust toolchain cache
        id: rust-toolchain-cache
        uses: https://github.com/actions/cache/restore@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
            ~/.cargo/bin/rustup
            ~/.cargo/bin/cargo
            ~/.cargo/bin/cargo-clippy
            ~/.cargo/bin/cargo-fmt
            ~/.cargo/bin/clippy-driver
            ~/.cargo/bin/rustc
            ~/.cargo/bin/rustdoc
            ~/.cargo/bin/rustfmt
          key: ${{ runner.os }}-rust-toolchain-slim-v2-bootstrap
          restore-keys: |
            ${{ runner.os }}-rust-toolchain-slim-v2-

      - name: Activate cached Rust tools
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          if command -v rustup >/dev/null 2>&1; then
            rustup --version
          fi
          if command -v cargo >/dev/null 2>&1; then
            cargo --version
          fi

      - name: Setup Rust stable
        id: rust-toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy,llvm-tools-preview

      - name: Restore Cargo cache
        uses: https://github.com/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-slim-v1-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-slim-v1-stable-

      - name: Check Cargo metadata
        run: cargo metadata --locked --format-version 1 >/tmp/bill-analyser-cargo-metadata.json

      - name: Run Rust format check
        run: cargo fmt --all -- --check

      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Build Rust HTTP server
        run: cargo build -p bill-analyser-http --bin bill_http_server

      - name: Install Rust coverage tool
        run: |
          rustup component add llvm-tools-preview
          if ! command -v cargo-llvm-cov >/dev/null 2>&1; then
            cargo install cargo-llvm-cov --locked
          fi

      - name: Wait for Postgres test service
        run: |
          for attempt in $(seq 1 30); do
            if (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "Postgres test service did not become reachable on postgres:5432"
          exit 1

      - name: Run Rust coverage
        env:
          BILL_ANALYSER_TEST_POSTGRES_URL: postgres://bill_analyser:bill_analyser_dev@postgres:5432/bill_analyser_test
          RUST_TEST_THREADS: 1
        run: cargo llvm-cov --workspace --lcov --output-path workspace.lcov --fail-under-lines 90

      - name: Trim backend caches before cache save
        id: backend-cache-trim
        if: always()
        run: |
          cache_size_mb() {
            total=0
            for cache_path in "$@"; do
              if [ -e "$cache_path" ]; then
                size="$(du -sm "$cache_path" | awk '{print $1 + 0}')"
                total=$((total + size))
              fi
            done
            echo "$total"
          }

          rm -rf target
          rm -f workspace.lcov /tmp/bill-analyser-cargo-metadata.json

          cargo_cache_mb="$(cache_size_mb ~/.cargo/registry ~/.cargo/git ~/.cargo/bin/cargo-llvm-cov)"
          if [ "$cargo_cache_mb" -gt 450 ]; then
            rm -rf ~/.cargo/registry/src ~/.cargo/git/checkouts
          fi
          cargo_cache_mb="$(cache_size_mb ~/.cargo/registry ~/.cargo/git ~/.cargo/bin/cargo-llvm-cov)"
          if [ "$cargo_cache_mb" -gt 450 ]; then
            rm -rf ~/.cargo/registry/cache ~/.cargo/git/db
          fi

          rustup_cache_mb="$(cache_size_mb ~/.rustup/toolchains ~/.rustup/update-hashes ~/.rustup/settings.toml ~/.cargo/bin/rustup ~/.cargo/bin/cargo ~/.cargo/bin/cargo-clippy ~/.cargo/bin/cargo-fmt ~/.cargo/bin/clippy-driver ~/.cargo/bin/rustc ~/.cargo/bin/rustdoc ~/.cargo/bin/rustfmt)"
          if [ "$rustup_cache_mb" -gt 1450 ]; then
            echo "rust_toolchain_cache_save=false" >> "$GITHUB_OUTPUT"
            rm -rf ~/.rustup/toolchains ~/.rustup/update-hashes ~/.rustup/settings.toml
            rm -f ~/.cargo/bin/rustup ~/.cargo/bin/cargo ~/.cargo/bin/cargo-clippy ~/.cargo/bin/cargo-fmt ~/.cargo/bin/clippy-driver ~/.cargo/bin/rustc ~/.cargo/bin/rustdoc ~/.cargo/bin/rustfmt
          else
            echo "rust_toolchain_cache_save=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Rust toolchain cache key
        id: rust-toolchain-cache-key
        run: echo "key=${{ runner.os }}-rust-toolchain-slim-v2-${{ steps.rust-toolchain.outputs.cachekey }}" >> "$GITHUB_OUTPUT"

      - name: Save Rust toolchain cache
        if: steps.backend-cache-trim.outputs.rust_toolchain_cache_save == 'true' && steps.rust-toolchain-cache.outputs.cache-matched-key != steps.rust-toolchain-cache-key.outputs.key
        uses: https://github.com/actions/cache/save@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
            ~/.cargo/bin/rustup
            ~/.cargo/bin/cargo
            ~/.cargo/bin/cargo-clippy
            ~/.cargo/bin/cargo-fmt
            ~/.cargo/bin/clippy-driver
            ~/.cargo/bin/rustc
            ~/.cargo/bin/rustdoc
            ~/.cargo/bin/rustfmt
          key: ${{ steps.rust-toolchain-cache-key.outputs.key }}

  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4

      - name: Setup Node.js 22
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore npm cache
        uses: https://github.com/actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-slim-v1-${{ hashFiles('src/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-slim-v1-

      - name: Install dependencies
        working-directory: src/web
        run: npm ci

      - name: Run lint
        working-directory: src/web
        run: npm run lint:ci

      - name: Run tests with coverage
        working-directory: src/web
        run: npm run test:coverage

      - name: Build frontend
        working-directory: src/web
        run: npm run build

      - name: Trim frontend caches before cache save
        if: always()
        working-directory: src/web
        run: |
          rm -rf node_modules coverage dist
          npm cache verify || true
          npm_cache_dir="$(npm config get cache)"
          npm_cache_mb=0
          if [ -e "$npm_cache_dir" ]; then
            npm_cache_mb="$(du -sm "$npm_cache_dir" | awk '{print $1 + 0}')"
          fi
          if [ "$npm_cache_mb" -gt 300 ]; then
            npm cache clean --force
          fi

  repo-governance:
    name: repo-governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v4

      - name: Ensure tracked source tree is Rust-only
        run: |
          tracked_py="$(git ls-files '*.py')"
          if [ -n "$tracked_py" ]; then
            echo "$tracked_py"
            echo "Tracked Python files are not allowed after the Rust-only cutover."
            exit 1
          fi

          py_lower='python'
          removed_files=".${py_lower}-version py""project.toml py""test.ini uv.lock"
          for removed in $removed_files; do
            if git ls-files --error-unmatch "$removed" >/dev/null 2>&1; then
              echo "$removed should not be tracked after the Rust-only cutover."
              exit 1
            fi
          done

      - name: Check removed runtime/tooling references
        run: |
          paths="AGENTS.md CLAUDE.md .codex .gitea docs README.md scripts start_backend.ps1 一键启动.ps1 build_static.ps1 .omx/plans/rust-full-rewrite-total-plan.md"
          py_word='Python'
          py_lower='python'
          agent_stack="agent_stack_health"".py"
          rust_deps="check_rust_workspace_dependencies"".py"
          plan_progress="omx_plan_progress"".py"
          pattern="BILL_ANALYSER_${py_word^^}_UPSTREAM|${py_word}Proxied|setup-${py_lower}|py""project|\\.v""env|${py_lower}\\.exe|${agent_stack}|${rust_deps}|${plan_progress}"
          if git grep -n -E "$pattern" -- $paths; then
            echo "Removed runtime/tooling references are still present."
            exit 1
          fi
