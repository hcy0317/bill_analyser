name: Backend CI

on:
  push:
    paths:
      - 'src/bill_analyser/**'
      - 'tests/**/*.py'
      - 'tests/fixtures/**'
      - 'pytest.ini'
      - 'pyproject.toml'
      - '.python-version'
      - 'uv.lock'
      - '.gitea/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'src/bill_analyser/**'
      - 'tests/**/*.py'
      - 'tests/fixtures/**'
      - 'pytest.ini'
      - 'pyproject.toml'
      - '.python-version'
      - 'uv.lock'
      - '.gitea/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: gitea-${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e .

      - name: Install test dependencies
        run: python -m pip install pytest pytest-asyncio pytest-cov pytest-mock pytest-xdist pytest-timeout python-dateutil inline-snapshot

      - name: Run pytest
        run: python -m pytest tests/ -v
