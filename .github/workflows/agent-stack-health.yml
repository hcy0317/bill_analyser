name: agent-stack-health

on:
  push:
    paths:
      - ".github/**"
      - ".claude/**"
      - ".codex/**"
      - ".agents/**"
      - "scripts/hooks/**"
      - "scripts/agent_stack_health.py"
      - "tests/test_agent_stack_health.py"
      - "tests/test_reviewer_agent_diff_contract.py"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/**"
      - ".claude/**"
      - ".codex/**"
      - ".agents/**"
      - "scripts/hooks/**"
      - "scripts/agent_stack_health.py"
      - "tests/test_agent_stack_health.py"
      - "tests/test_reviewer_agent_diff_contract.py"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  verify-agent-stack:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run agent-stack contract tests
        run: python -m pytest tests/test_reviewer_agent_diff_contract.py tests/test_agent_stack_health.py -v