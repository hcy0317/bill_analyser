name: agent-stack-health

on:
  push:
    paths:
      - ".github/**"
      - ".claude/**"
      - ".codex/**"
      - ".agents/**"
      - "docs/AI_WORKFLOW.md"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/**"
      - ".claude/**"
      - ".codex/**"
      - ".agents/**"
      - "docs/AI_WORKFLOW.md"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  verify-agent-stack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate AI adapter hook configs
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          json_files = [
              Path(".codex/hooks.json"),
              Path(".claude/settings.json"),
              *sorted(Path(".github/hooks").glob("*.json")),
          ]
          missing = [str(path) for path in json_files if not path.exists()]
          if missing:
              print("Missing adapter JSON files:")
              print("\n".join(missing))
              sys.exit(1)

          forbidden = (
              "scripts/hooks/",
              "scripts\\hooks\\",
              "scripts/agent_stack_health.py",
              "scripts\\agent_stack_health.py",
          )
          stale_refs = []
          for path in json_files:
              text = path.read_text(encoding="utf-8")
              json.loads(text)
              for token in forbidden:
                  if token in text:
                      stale_refs.append(f"{path}: references deleted {token}")

          if stale_refs:
              print("Stale hook references:")
              print("\n".join(stale_refs))
              sys.exit(1)

          print("AI adapter hook configs are valid and contain no deleted hook entrypoints.")
          PY
