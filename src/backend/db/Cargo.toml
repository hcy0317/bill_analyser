version.workspace = true
edition.workspace = true
license.workspace = true
description = "Internal SQLite runtime and PostgreSQL migration foundations for Bill Analyser."
publish = false

[lib]
name = "bill_analyser_db"
path = "lib.rs"

[dependencies]
bill-analyser-core = { path = "../core" }
bill-analyser-parsers = { path = "../parsers" }
