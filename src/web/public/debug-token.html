<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token 调试工具</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            line-height: 1.6;
        }
        .section {
            background: #252526;
            border: 1px solid #3c3c3c;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .section h2 {
            color: #4ec9b0;
            margin-top: 0;
        }
        .item {
            margin: 10px 0;
        }
        .label {
            color: #9cdcfe;
            font-weight: bold;
        }
        .value {
            color: #ce9178;
            word-break: break-all;
        }
        .success {
            color: #4ec9b0;
        }
        .error {
            color: #f48771;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 3px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #1177bb;
        }
    </style>
</head>
<body>
    <h1>🔍 Token 调试工具</h1>
    
    <div class="section">
        <h2>LocalStorage 状态</h2>
        <div id="localStorage-content"></div>
    </div>
    
    <div class="section">
        <h2>SessionStorage 状态</h2>
        <div id="sessionStorage-content"></div>
    </div>
    
    <div class="section">
        <h2>Token 验证</h2>
        <div id="token-validation"></div>
        <button onclick="testTokenAPI()">测试 /api/accounts/ 请求</button>
        <button onclick="location.reload()">刷新页面</button>
    </div>
    
    <div class="section">
        <h2>API 测试结果</h2>
        <div id="api-result"></div>
    </div>

    <script>
        // 显示localStorage内容
        function displayLocalStorage() {
            const container = document.getElementById('localStorage-content');
            const token = localStorage.getItem('ebk_user_token');
            const lastLogin = localStorage.getItem('ebk_last_login_time');
            
            container.innerHTML = `
                <div class="item">
                    <span class="label">ebk_user_token:</span><br>
                    <span class="value ${token ? 'success' : 'error'}">${token || '❌ 不存在'}</span>
                </div>
                <div class="item">
                    <span class="label">Token长度:</span>
                    <span class="value ${token ? 'success' : 'error'}">${token ? token.length : 0}</span>
                </div>
                <div class="item">
                    <span class="label">Token前缀:</span>
                    <span class="value ${token ? 'success' : 'error'}">${token ? token.substring(0, 20) + '...' : 'N/A'}</span>
                </div>
                <div class="item">
                    <span class="label">是否JWT:</span>
                    <span class="value ${token && token.startsWith('eyJ') ? 'success' : 'error'}">${token && token.startsWith('eyJ') ? '✓ 是' : '✗ 否'}</span>
                </div>
                <div class="item">
                    <span class="label">最后登录时间:</span>
                    <span class="value">${lastLogin ? new Date(parseInt(lastLogin)).toLocaleString() : '未记录'}</span>
                </div>
            `;
        }
        
        // 显示sessionStorage内容
        function displaySessionStorage() {
            const container = document.getElementById('sessionStorage-content');
            const sessionToken = sessionStorage.getItem('ebk_user_session_token');
            const encryptedToken = sessionStorage.getItem('ebk_user_encrypted_session_token');
            
            container.innerHTML = `
                <div class="item">
                    <span class="label">ebk_user_session_token:</span><br>
                    <span class="value">${sessionToken || '❌ 不存在'}</span>
                </div>
                <div class="item">
                    <span class="label">ebk_user_encrypted_session_token:</span><br>
                    <span class="value">${encryptedToken || '❌ 不存在'}</span>
                </div>
            `;
        }
        
        // Token验证
        function validateToken() {
            const container = document.getElementById('token-validation');
            const token = localStorage.getItem('ebk_user_token');
            
            if (!token) {
                container.innerHTML = '<div class="error">❌ 未找到Token！请先登录。</div>';
                return;
            }
            
            // 尝试解析JWT
            try {
                const parts = token.split('.');
                if (parts.length !== 3) {
                    container.innerHTML = '<div class="error">❌ Token格式错误：不是标准JWT格式</div>';
                    return;
                }
                
                const payload = JSON.parse(atob(parts[1]));
                const now = Math.floor(Date.now() / 1000);
                const expired = payload.exp < now;
                
                container.innerHTML = `
                    <div class="item">
                        <span class="label">Token解析:</span>
                        <span class="value success">✓ 成功</span>
                    </div>
                    <div class="item">
                        <span class="label">用户ID:</span>
                        <span class="value">${payload.sub || 'N/A'}</span>
                    </div>
                    <div class="item">
                        <span class="label">过期时间:</span>
                        <span class="value">${new Date(payload.exp * 1000).toLocaleString()}</span>
                    </div>
                    <div class="item">
                        <span class="label">是否过期:</span>
                        <span class="value ${expired ? 'error' : 'success'}">${expired ? '✗ 已过期' : '✓ 有效'}</span>
                    </div>
                    <div class="item">
                        <span class="label">剩余时间:</span>
                        <span class="value">${Math.floor((payload.exp - now) / 3600)} 小时</span>
                    </div>
                `;
            } catch (e) {
                container.innerHTML = `<div class="error">❌ Token解析失败：${e.message}</div>`;
            }
        }
        
        // 测试API请求
        async function testTokenAPI() {
            const result = document.getElementById('api-result');
            const token = localStorage.getItem('ebk_user_token');
            
            if (!token) {
                result.innerHTML = '<div class="error">❌ 未找到Token！</div>';
                return;
            }
            
            result.innerHTML = '<div>⏳ 正在测试API请求...</div>';
            
            try {
                const response = await fetch('http://127.0.0.1:5000/api/accounts/?visible_only=false', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    result.innerHTML = `
                        <div class="success">✓ API请求成功！状态码: ${response.status}</div>
                        <div class="item">
                            <span class="label">响应数据:</span><br>
                            <pre style="background:#1e1e1e;padding:10px;overflow:auto;">${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    result.innerHTML = `
                        <div class="error">✗ API请求失败！状态码: ${response.status}</div>
                        <div class="item">
                            <span class="label">错误信息:</span><br>
                            <pre style="background:#1e1e1e;padding:10px;overflow:auto;">${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                result.innerHTML = `<div class="error">❌ 网络错误：${error.message}</div>`;
            }
        }
        
        // 页面加载时执行
        displayLocalStorage();
        displaySessionStorage();
        validateToken();
    </script>
</body>
</html>
